# ===========================================================================
# COMPONENTS & SCHEMAS
# ===========================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          type: object
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    ErrorResponse:
      type: object
      required: [success, message, error]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
        error:
          type: string
          example: Field "password" is required
        code:
          type: string
          example: MONGOOSE_VALIDATION_ERROR

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 48
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 50
        pages:
          type: integer
          example: 1

    HealthResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            api: { type: string, example: healthy }
            server: { type: string, example: online }
            database: { type: string, example: connected }
            timestamp: { type: string, format: date-time }
            version: { type: string, example: v1 }
            uptime: { type: integer, example: 1420 }
            environment: { type: string, example: development }
        message: { type: string }

    AuthSuccessResponse:
