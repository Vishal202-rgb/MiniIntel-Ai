openapi: 3.0.3
info:
  title: MineIntel AI REST API
  description: >
    Comprehensive REST API for MineIntel AI (Mining Intelligence, Regulatory Compliance
    & Automated Document Processing). Tailored for cross-platform Flutter clients targeting
    Android, iOS, and Windows Desktop.
  version: 1.0.0
  contact:
    name: MineIntel AI Engineering Team
servers:
  - url: http://10.0.2.2:5000/api/v1
    description: Android Emulator Local Bridge
  - url: http://127.0.0.1:5000/api/v1
    description: iOS Simulator & Windows Desktop Localhost
  - url: http://localhost:5000/api/v1
    description: Localhost Development Server
  - url: https://api.mineintel.ai/api/v1
    description: Production HTTPS Endpoint

security:
  - BearerAuth: []

tags:
  - name: Health
    description: System readiness and environment status
  - name: Auth
    description: Authentication, registration, and user profiles
  - name: Admin
    description: Administrative user management and platform statistics
  - name: Dashboard
    description: User and admin analytics dashboards
  - name: Command Centre
    description: Pipeline operations and attention queue
  - name: Settings
    description: User preferences (language, theme, notifications)
  - name: Help
    description: FAQs and support guides
  - name: Documents
    description: Document ingestion, parsing, OCR, and storage
  - name: Extraction
    description: Parameter extraction and Human-in-the-Loop review
  - name: Validation
    description: Automated rule validation and quality scoring
  - name: Reports
    description: Statutory report generation and multi-format exports
  - name: Reviews
    description: Dedicated review and approval queues
  - name: Knowledge Base
    description: Vector embeddings, indexing, and semantic search
  - name: RAG
    description: Retrieval-Augmented Generation low-level vector engine
  - name: AI Assistant
    description: Conversational intelligence with cited evidence
  - name: Analytics
    description: Production metrics, variance, and anomaly detection
  - name: Topics
    description: Topic discovery, clustering, and trends
  - name: Agents
    description: Multi-agent autonomous workflow orchestration
  - name: Audit
    description: Immutable audit trail and provenance logs
  - name: Notifications
    description: In-app notification center
  - name: Intelligence
    description: Cross-document correlations and entity relationships
  - name: Integration
    description: External DMS, MIS, and GIS geo-spatial feeds

paths:
  # =========================================================================
  # 1. HEALTH
  # =========================================================================
  /health:
    get:
      tags: [Health]
      summary: Check system and database health
      description: Public health check returning database connection state, uptime, and API version.
      security: []
      responses:
        '200':
          description: API is operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database disconnected or degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # =========================================================================
  # 2. AUTHENTICATION & PROFILE
  # =========================================================================
  /auth/register:
    post:
      tags: [Auth]
      summary: Register standard user
      description: Creates a standard user account with role 'user'. Reserved admin usernames are rejected.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  example: mining_engineer
                password:
                  type: string
                  minLength: 6
                  example: SecurePassword123!
                email:
                  type: string
                  format: email
                  example: engineer@mineintel.ai
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: Validation failure or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Reserved identity registration blocked

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user or admin
      description: Authenticates user credentials. Issues 30-day HMAC SHA-256 JWT. Auto-provisions admin if credentials match system admin environment configuration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: mining_engineer
                password:
                  type: string
                  example: SecurePassword123!
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is suspended or inactive

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout session
      description: Logs user logout and records an audit trail event if Bearer token is provided.
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user profile
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  /auth/profile:
    put:
      tags: [Auth]
      summary: Update profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                department:
                  type: string
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /auth/change-password:
    put:
      tags: [Auth]
      summary: Change authenticated user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password changed successfully

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh authorization token
      description: Accepts token either in Authorization header or in request body.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: '#/components/schemas/UserSummary'

  # =========================================================================
  # 3. ADMIN MANAGEMENT
  # =========================================================================
  /admin/users:
    get:
      tags: [Admin]
      summary: List all users (Admin only)
      responses:
        '200':
          description: Array of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '403':
          description: Non-admin forbidden

  /admin/users/{id}/role:
    put:
      tags: [Admin]
      summary: Update user role (Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [user, reviewer]
      responses:
        '200':
          description: Role updated
        '403':
          description: Cannot assign admin role

  /admin/users/{id}:
    delete:
      tags: [Admin]
      summary: Delete user account (Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: User deleted
        '403':
          description: Self-deletion or admin account deletion forbidden

  /admin/stats:
    get:
      tags: [Admin]
      summary: System overview statistics
      responses:
        '200':
          description: Platform statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      totalUsers: { type: integer }
                      totalDocuments: { type: integer }
                      indexedDocuments: { type: integer }
                      reportsGenerated: { type: integer }
                      totalValidations: { type: integer }
                      openValidations: { type: integer }

  /admin/system-health:
    get:
      tags: [Admin]
      summary: Detailed subsystem health
      responses:
        '200':
          description: Health indicators

  # =========================================================================
  # 4. DASHBOARD
  # =========================================================================
  /dashboard/overview:
    get:
      tags: [Dashboard]
      summary: Aggregated dashboard summary
      responses:
        '200':
          description: User/admin dashboard overview

  /dashboard/kpis:
    get:
      tags: [Dashboard]
      summary: Key performance indicators
      responses:
        '200':
          description: Numerical KPI values

  /dashboard/activity:
    get:
      tags: [Dashboard]
      summary: Activity audit stream
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 15 }
      responses:
        '200':
          description: Array of activity events

  /dashboard/alerts:
    get:
      tags: [Dashboard]
      summary: Critical alerts requiring attention
      responses:
        '200':
          description: Alerts list

  /dashboard/recent-documents:
    get:
      tags: [Dashboard]
      summary: Most recently uploaded documents
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Documents array

  # =========================================================================
  # 5. COMMAND CENTRE
  # =========================================================================
  /command-centre/overview:
    get:
      tags: [Command Centre]
      summary: Multi-tenant operations overview
      responses:
        '200':
          description: Overview metrics

  /command-centre/pipeline:
    get:
      tags: [Command Centre]
      summary: Real-time ingestion queue status
      responses:
        '200':
          description: Queue metrics

  /command-centre/status:
    get:
      tags: [Command Centre]
      summary: Subsystem health statuses
      responses:
        '200':
          description: Health state

  /command-centre/attention-items:
    get:
      tags: [Command Centre]
      summary: Items requiring human intervention
      responses:
        '200':
          description: Urgent items

  /command-centre/activity:
    get:
      tags: [Command Centre]
      summary: Live operations feed
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Live feed array

  # =========================================================================
  # 6. SETTINGS
  # =========================================================================
  /settings:
    get:
      tags: [Settings]
      summary: Retrieve complete user settings tree
      responses:
        '200':
          description: Settings data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
    put:
      tags: [Settings]
      summary: Bulk update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateRequest'
      responses:
        '200':
          description: Settings updated

  /settings/language:
    get:
      tags: [Settings]
      summary: Get language preferences
      responses:
        '200':
          description: Language settings
    put:
      tags: [Settings]
      summary: Update language preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language:
                  type: string
                  enum: [en, hi]
      responses:
        '200':
          description: Language updated

  /settings/appearance:
    get:
      tags: [Settings]
      summary: Get appearance settings
      responses:
        '200':
          description: Appearance settings
    put:
      tags: [Settings]
      summary: Update theme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theme]
              properties:
                theme:
                  type: string
                  enum: [light, dark]
      responses:
        '200':
          description: Theme updated

  /settings/notifications:
    get:
      tags: [Settings]
      summary: Get notification preferences
      responses:
        '200':
          description: Notification settings
    put:
      tags: [Settings]
      summary: Update notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emailNotif: { type: boolean }
                pushNotif: { type: boolean }
                reportAlerts: { type: boolean }
      responses:
        '200':
          description: Preferences updated

  # =========================================================================
  # 7. HELP & FAQS
  # =========================================================================
  /help:
    get:
      tags: [Help]
      summary: Help categories and overview
      responses:
        '200':
          description: Help overview

  /help/faqs:
    get:
      tags: [Help]
      summary: List FAQs with category/search filters
      parameters:
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: FAQs array

  /help/search:
    get:
      tags: [Help]
      summary: Full-text search across documentation
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Search results

  /help/faqs/{id}:
    get:
      tags: [Help]
      summary: Specific FAQ details
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: FAQ item

  # =========================================================================
  # 8. DOCUMENTS
  # =========================================================================
  /documents/upload:
    post:
      tags: [Documents]
      summary: Upload document (Multipart)
      description: Uploads document binary, computes SHA-256 hash for deduplication (returns 409 on duplicate), and queues background OCR/parsing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Document file (PDF, DOCX, XLSX, CSV, PPTX, Image)
      responses:
        '201':
          description: Document uploaded and queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Document'
        '400':
          description: No file uploaded or invalid mime type
        '409':
          description: Duplicate document detected by checksum

  /documents:
    get:
      tags: [Documents]
      summary: List documents with filtering & pagination
      description: Non-admin users see only their own documents. Admins see all tenant documents.
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: type
          schema:
            type: string
            enum: [pdf, docx, xlsx, csv, image, pptx]
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, processing, completed, failed, extracted]
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: classification
          schema:
            type: string
            enum: [public, internal, confidential, restricted]
        - in: query
          name: dateFrom
          schema: { type: string, format: date-time }
        - in: query
          name: dateTo
          schema: { type: string, format: date-time }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Paginated documents array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentResponse'

  /documents/{id}:
    get:
      tags: [Documents]
      summary: Get document details and extracted pages
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Document and extracted pages
    delete:
      tags: [Documents]
      summary: Delete document and associated chunks/files
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted document ID

  /documents/{id}/download:
    get:
      tags: [Documents]
      summary: Download original document file binary
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Binary file stream with Content-Disposition attachment
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /documents/{id}/metadata:
    get:
      tags: [Documents]
      summary: Retrieve technical & GIS metadata
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Metadata object
    put:
      tags: [Documents]
      summary: Update document metadata
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category: { type: string }
                classification:
                  type: string
                  enum: [public, internal, confidential, restricted]
                gisMetadata:
                  type: object
                  properties:
                    latitude: { type: number }
                    longitude: { type: number }
                    region: { type: string }
                retentionDate: { type: string, format: date-time }
      responses:
        '200':
          description: Updated document

  /documents/{id}/reprocess:
    post:
      tags: [Documents]
      summary: Trigger re-ingestion and OCR
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Queued for reprocessing

  /documents/{id}/status:
    get:
      tags: [Documents]
      summary: Ingestion progress & steps (Poll this endpoint)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ProcessingJob object
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProcessingJob'

  # =========================================================================
  # 9. EXTRACTION & HITL
  # =========================================================================
  /extraction/run:
    post:
      tags: [Extraction]
      summary: Run AI parameter extraction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId]
              properties:
                documentId: { type: string }
      responses:
        '200':
          description: Extracted records

  /extraction/{documentId}:
    get:
      tags: [Extraction]
      summary: Extraction summary & stats for document
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Summary and records

  /extraction/{documentId}/records:
    get:
      tags: [Extraction]
      summary: List extracted records for document
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
        - in: query
          name: parameter
          schema: { type: string }
        - in: query
          name: mineName
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Paginated records array

  /extraction/{documentId}/records/{recordId}:
    put:
      tags: [Extraction]
      summary: Edit extracted record value/unit with audit trail
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
        - in: path
          name: recordId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value: { type: string }
                unit: { type: string }
                parameter: { type: string }
                status:
                  type: string
                  enum: [pending, approved, rejected]
                period: { type: string }
                mineName: { type: string }
                subsidiary: { type: string }
      responses:
        '200':
          description: Updated record

  /extraction/{documentId}/reprocess:
    post:
      tags: [Extraction]
      summary: Clear and re-run extraction
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Re-extraction completed

  /extraction/records/{id}/approve:
    post:
      tags: [Extraction]
      summary: Approve single record
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Record approved

  /extraction/records/{id}/reject:
    post:
      tags: [Extraction]
      summary: Reject single record
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Record rejected

  /extraction/records/bulk-approve:
    post:
      tags: [Extraction]
      summary: Bulk approve records by ID array
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Matched and modified counts

  # =========================================================================
  # 10. VALIDATION & QUALITY CONTROL
  # =========================================================================
  /validation/run:
    post:
      tags: [Validation]
      summary: Run validation rules & compute quality metrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId]
              properties:
                documentId: { type: string }
      responses:
        '200':
          description: Validation report with qualityScore

  /validation:
    get:
      tags: [Validation]
      summary: List validation issues across documents
      parameters:
        - in: query
          name: documentId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [all, open, resolved, ignored] }
        - in: query
          name: severity
          schema: { type: string, enum: [info, warning, error, critical] }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Issues list with quality metrics

  /validation/summary:
    get:
      tags: [Validation]
      summary: Get validation KPI summary
      parameters:
        - in: query
          name: documentId
          schema: { type: string }
      responses:
        '200':
          description: KPI summary

  /validation/{documentId}:
    get:
      tags: [Validation]
      summary: Validation details for specific document
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Document validation metrics & issues

  /validation/{documentId}/issues:
    get:
      tags: [Validation]
      summary: Filtered issues list for document
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: severity
          schema: { type: string }
      responses:
        '200':
          description: Issues array

  /validation/issues/{issueId}:
    put:
      tags: [Validation]
      summary: Resolve issue and sync correction to extracted record
      parameters:
        - in: path
          name: issueId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [open, resolved, ignored]
                  default: resolved
                correctedValue: { type: string }
                resolution: { type: string }
                notes: { type: string }
      responses:
        '200':
          description: Issue resolved and record updated

  /validation/{documentId}/approve:
    post:
      tags: [Validation]
      summary: Approve document validation & finalize all pending records
      parameters:
